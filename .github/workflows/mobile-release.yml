# Phone binaries share the desktop release tag. The reusable workflow produces
# Store signing runs afterwards. Legacy mobile-v* tags still draft a prerelease.
# Secrets live in the protected mobile-release environment.

name: mobile-release

on:
  workflow_call:
    inputs:
      release_ref:
        description: Exact desktop release tag to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to build (empty uses the selected ref)
        type: string
        default: ''
      android:
        description: Build Android
        type: boolean
        default: true
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'push' || inputs.release_ref != '' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: mobile-release
    concurrency:
      group: signed-android-builds
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false

      - name: Validate release source
        if: inputs.release_ref != ''
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")"
          test "${RELEASE_REF#v}" = "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: SDK location
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Cache native runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/native/android/build
          key: android-native-${{ hashFiles('mobile/native/pins.json', 'mobile/native/android/**', '!mobile/native/android/build/**', 'mobile/native/mp3/**', 'mobile/ios/VoiceStudioKit/Sources/VSNative/Lame/**', 'mobile/ios/VoiceStudioKit/Sources/VSNative/Mp3Encoder.c', 'mobile/ios/VoiceStudioKit/Sources/VSNative/include/Mp3Encoder.h') }}

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::ANDROID_UPLOAD_KEYSTORE is not set in the mobile-release environment"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          VOICESTUDIO_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOICESTUDIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VOICESTUDIO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VOICESTUDIO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Shared clock and serialized builds keep codes increasing across both release workflows.
          export VOICESTUDIO_ANDROID_VERSION_CODE="$(python3 "$GITHUB_WORKSPACE/scripts/android_version_code.py")"
          test -n "$VOICESTUDIO_ANDROID_VERSION_CODE"
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/VoiceStudio.apk"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/VoiceStudio.aab"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceStudio-android-release
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets

      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p out
          cp assets/VoiceStudio-android-release/VoiceStudio.apk "out/VoiceStudio-${TAG}.apk"
          cp assets/VoiceStudio-android-release/VoiceStudio.aab "out/VoiceStudio-${TAG}.aab"
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          VoiceStudio phone apps ${TAG}. Preview builds; they run models on the phone.

          | File | Use |
          |---|---|
          | \`VoiceStudio-${TAG}.apk\` | Android: install directly (allow installs from this source) |
          | \`VoiceStudio-${TAG}.aab\` | Android App Bundle for Google Play |

          Verify downloads against \`SHA256SUMS.txt\`. Details: docs/mobile.md.
          NOTES
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true || { echo "Refusing to replace a published release"; exit 1; }
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" --verify-tag --draft --prerelease --title "$TAG — VoiceStudio mobile" --notes-file notes.md
          fi
